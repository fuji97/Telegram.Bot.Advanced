name: Publish to nuget
on:
  push:
    tags:
      - "v*"
jobs:
  publish:
    name: Build, pack & publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore Telegram.Bot.Advanced.slnx

      - name: Build
        run: dotnet build Telegram.Bot.Advanced.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Telegram.Bot.Advanced.Tests/Telegram.Bot.Advanced.Tests.csproj --configuration Release --no-build

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(dotnet msbuild Telegram.Bot.Advanced/Telegram.Bot.Advanced.csproj -getProperty:Version)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${PROJECT_VERSION}" != "${TAG_VERSION}" ]; then
            echo "Project version '${PROJECT_VERSION}' does not match tag version '${TAG_VERSION}'" >&2
            exit 1
          fi

      - name: Pack
        run: dotnet pack Telegram.Bot.Advanced/Telegram.Bot.Advanced.csproj --configuration Release --no-build --output artifacts

      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate
